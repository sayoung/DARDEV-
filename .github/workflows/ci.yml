# CI Xplor (NF-08). Déclenchée sur main et develop.
# Aucun secret : les identifiants Postgres sont ceux du développement local
# (.env.example, décision D-31), pas des secrets de production.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xplor
          POSTGRES_PASSWORD: xplor
          POSTGRES_DB: xplor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xplor -d xplor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Créer la base xplor_test
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          PGPASSWORD=xplor psql -h localhost -U xplor -d xplor -c "CREATE DATABASE xplor_test;" || true

      - name: Tests d'intégration
        run: pnpm test:int
        env:
          DATABASE_URL_TEST: postgresql://xplor:xplor@localhost:5432/xplor_test
          REDIS_URL: redis://localhost:6379
          SEED_DEFAULT_PASSWORD: xplor-seed-dev-2026

      # D-59. Identifiants de développement (.env.example), pas des secrets.
      - name: API smoke
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=xplor \
            -e MINIO_ROOT_PASSWORD=xplor-dev-secret \
            minio/minio server /data
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "MinIO n'a pas répondu sur /minio/health/live."
            docker logs minio || true
            exit 1
          fi
          bucket_ok=0
          for _ in $(seq 1 15); do
            if docker run --rm --network container:minio \
              -e MC_HOST_local=http://xplor:xplor-dev-secret@127.0.0.1:9000 \
              minio/mc mb --ignore-existing local/xplor; then
              bucket_ok=1
              break
            fi
            sleep 2
          done
          if [ "$bucket_ok" -ne 1 ]; then
            echo "Impossible de créer le bucket xplor."
            docker logs minio || true
            exit 1
          fi
          pnpm --filter @xplor/api db:deploy
          pnpm --filter @xplor/api db:seed
          nohup pnpm --filter @xplor/api exec tsx src/main.ts > "${RUNNER_TEMP}/xplor-api.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/xplor-api.pid"
          set +e
          node scripts/ci-api-smoke.mjs
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "---- journal API ----"
            node --input-type=module -e "import { readFileSync } from 'node:fs'; const secret = process.env.SEED_DEFAULT_PASSWORD ?? ''; let text = ''; try { text = readFileSync(process.env.RUNNER_TEMP + '/xplor-api.log', 'utf8'); } catch { process.exit(0); } if (secret !== '') text = text.split(secret).join('[redacted]'); process.stdout.write(text);" || true
            exit "$status"
          fi
        env:
          NODE_ENV: development
          PORT: "3000"
          DATABASE_URL: postgresql://xplor:xplor@localhost:5432/xplor
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: xplor
          S3_SECRET_KEY: xplor-dev-secret
          S3_BUCKET: xplor
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SESSION_SECRET: dev-only-session-secret-not-for-production
          ADMIN_BASE_URL: http://localhost:5173
          SEED_DEFAULT_PASSWORD: xplor-seed-dev-2026
          API_BASE_URL: http://127.0.0.1:3000

      - name: Arrêter l'API
        if: always()
        run: |
          pid_file="${RUNNER_TEMP}/xplor-api.pid"
          if [ ! -f "$pid_file" ]; then
            exit 0
          fi
          pid="$(cat "$pid_file")"
          if [ -z "${pid}" ]; then
            exit 0
          fi
          kill_tree() {
            local parent="$1"
            local child
            for child in $(ps -o pid= --ppid "$parent" 2>/dev/null || true); do
              kill_tree "$child"
            done
            kill "$parent" 2>/dev/null || true
          }
          kill_tree "$pid"

      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Publier les résultats Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          include-hidden-files: true

      - name: Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://xplor:xplor@localhost:5432/xplor
          DATABASE_URL_TEST: postgresql://xplor:xplor@localhost:5432/xplor_test
          REDIS_URL: redis://localhost:6379

      - name: Audit
        run: pnpm audit --audit-level=high
