name: xplor-prod

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - xplor_prod_pg:/var/lib/postgresql/data
    networks:
      - xplor_prod
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    env_file: .env.production
    volumes:
      - xplor_prod_redis:/data
    networks:
      - xplor_prod
    restart: unless-stopped

  minio:
    build: ./docker/minio
    image: xplor-prod-minio:2025-09-07
    command: server /data
    env_file: .env.production
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - xplor_prod_minio:/data
    networks:
      - xplor_prod
    restart: unless-stopped

  minio-init:
    build: ./docker/minio
    image: xplor-prod-minio:2025-09-07
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env.production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET/panoramas"
    networks:
      - xplor_prod
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xplor_prod
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xplor_prod
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - xplor_prod_caddy_data:/data
      - xplor_prod_caddy_config:/config
      - ${DEMO_SITE_DIR}:/srv/demo:ro
    networks:
      - xplor_prod
    restart: unless-stopped

networks:
  xplor_prod:
    name: xplor_prod_net

volumes:
  xplor_prod_pg:
  xplor_prod_redis:
  xplor_prod_minio:
  xplor_prod_caddy_data:
  xplor_prod_caddy_config:
