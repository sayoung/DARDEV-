name: xplor-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - xplor_prod_pg:/var/lib/postgresql/data
    env_file:
      - .env.production
    networks:
      - xplor_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - xplor_prod_redis:/data
    env_file:
      - .env.production
    networks:
      - xplor_prod

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data
    volumes:
      - xplor_prod_minio:/data
    env_file:
      - .env.production
    networks:
      - xplor_prod

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on:
      - minio
    env_file:
      - .env.production
    networks:
      - xplor_prod
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        sleep 5
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET/panoramas"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    networks:
      - xplor_prod

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    networks:
      - xplor_prod

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - xplor_prod_caddy_data:/data
      - xplor_prod_caddy_config:/config
      - ${DEMO_SITE_DIR}:/srv/demo:ro
    env_file:
      - .env.production
    networks:
      - xplor_prod

networks:
  xplor_prod:

volumes:
  xplor_prod_pg:
  xplor_prod_redis:
  xplor_prod_minio:
  xplor_prod_caddy_data:
  xplor_prod_caddy_config:
